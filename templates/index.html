<!DOCTYPE html>
<html>

<head>
<title>Movie Review Sentiment Analysis</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#89f7fe,#66a6ff);
    text-align:center;
    padding-top:80px;
}

.container{
    background:white;
    width:500px;
    margin:auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
}

h1{
    color:#333;
}

textarea{
    width:90%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    margin-top:15px;
    padding:10px 25px;
    border:none;
    background:#007BFF;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.positive{
    color:green;
}

.negative{
    color:red;
}

</style>

</head>

<body>

<div class="container">

<h1>🎬 Movie Review Sentiment Analysis</h1>

<form action="/predict" method="post">

<textarea name="review" rows="5" placeholder="Enter your movie review here..."></textarea>

<br>

<button type="submit">Predict Sentiment</button>

</form>

{% if prediction %}

<div class="result">

{% if prediction == "positive" %}

<p class="positive">😊 Positive Review</p>

{% elif prediction == "negative" %}

<p class="negative">😞 Negative Review</p>

{% endif %}

</div>

{% endif %}

</div>

</body>

</html>
